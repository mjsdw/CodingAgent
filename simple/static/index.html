<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeAgent · AI 编程助手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff;
      --surface: #fbfbfd;
      --surface-2: #f5f5f7;
      --surface-3: #eeeef1;
      --editor-bg: #ffffff;
      --chat-bg: #ffffff;
      --border: #ededf1;
      --border-subtle: #f2f2f5;
      --border-strong: #d8d8dd;
      --text: #18181b;
      --text-muted: #6b6b76;
      --text-subtle: #a0a0ab;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: #eef2ff;
      --accent-glow: rgba(79,70,229,0.10);
      --user-bubble-bg: #f5f5f7;
      --success: #16a34a;
      --success-soft: #dcfce7;
      --warning: #d97706;
      --warning-soft: #fef3c7;
      --error: #dc2626;
      --error-soft: #fee2e2;
      --shadow-xs: 0 1px 2px rgba(15,15,25,0.04);
      --shadow-sm: 0 1px 3px rgba(15,15,25,0.06), 0 1px 2px rgba(15,15,25,0.04);
      --shadow-md: 0 4px 16px rgba(15,15,25,0.07), 0 1px 4px rgba(15,15,25,0.04);
      --shadow-lg: 0 12px 40px rgba(15,15,25,0.12), 0 4px 12px rgba(15,15,25,0.06);
      --shadow-composer: 0 1px 4px rgba(15,15,25,0.05), 0 8px 24px rgba(79,70,229,0.06);
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --font-ui: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: "JetBrains Mono", "SF Mono", "Cascadia Code", "Consolas", monospace;
    }
    html, body { height: 100%; }
    body {
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "cv11", "ss01";
      letter-spacing: -0.006em;
    }
    ::selection { background: var(--accent-soft); color: var(--accent); }

    /* SVG icon defaults */
    .icon { display: inline-flex; flex-shrink: 0; }
    .icon svg { display: block; }

    /* ---- 顶部栏 ---- */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      height: 36px;
      z-index: 10;
    }
    header h1 {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    header h1 .logo-dot {
      width: 18px; height: 18px;
      border-radius: 5px;
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 55%, #818cf8 100%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
    }
    header h1 .logo-dot svg { color: #fff; }
    header .subtitle {
      font-size: 11px;
      color: var(--text-muted);
      padding: 1px 8px;
      background: transparent;
      border: none;
      border-radius: 20px;
      font-weight: 500;
      letter-spacing: 0;
    }
    #open-project-btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0 10px;
      border-radius: var(--radius-sm);
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      font-family: var(--font-ui);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 24px;
    }
    #open-project-btn:hover { background: #fff; border-color: var(--border-strong); box-shadow: var(--shadow-xs); }
    #open-project-btn:active { transform: translateY(0); }
    #open-project-btn:disabled { background: var(--surface-2); color: var(--text-subtle); cursor: not-allowed; box-shadow: none; transform: none; opacity: 0.7; }
    #project-path-input {
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0 10px;
      border-radius: var(--radius-sm);
      font-size: 11.5px;
      font-family: var(--font-mono);
      width: 240px;
      outline: none;
      transition: all 0.15s;
      height: 24px;
    }
    #project-path-input:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px var(--accent-glow); }
    #project-path-input::placeholder { color: var(--text-subtle); }
    #open-path-btn {
      background: var(--accent);
      color: #fff;
      border: 1px solid var(--accent);
      padding: 0 10px;
      border-radius: var(--radius-sm);
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      font-family: var(--font-ui);
      height: 24px;
      transition: background 0.15s;
    }
    #open-path-btn:hover { background: var(--accent-hover); }
    .header-spacer { flex: 1; }
    #session-info {
      font-size: 10.5px;
      color: var(--text-subtle);
      font-family: var(--font-mono);
      padding: 2px 7px;
      background: var(--surface-2);
      border-radius: var(--radius-sm);
    }
    #clear-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0 9px;
      font-size: 11.5px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.15s;
      font-family: var(--font-ui);
      font-weight: 500;
      height: 24px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    #clear-btn:hover { border-color: var(--border-strong); color: var(--text); background: var(--surface-2); }

    /* ---- 四栏主体 ---- */
    #main-body {
      flex: 1;
      display: grid;
      grid-template-columns: 48px 244px 1fr 392px;
      overflow: hidden;
    }

    /* ---- Activity Bar（最左图标栏） ---- */
    #activity-bar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      gap: 4px;
      flex-shrink: 0;
    }
    .activity-icon {
      width: 32px; height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      color: var(--text-subtle);
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
    }
    .activity-icon:hover { color: var(--text-muted); background: var(--surface-2); }
    .activity-icon.active { color: var(--text); }
    .activity-icon.active::before {
      content: '';
      position: absolute;
      left: -8px;
      top: 50%;
      transform: translateY(-50%);
      width: 2px; height: 16px;
      background: var(--accent);
      border-radius: 0 2px 2px 0;
    }
    .activity-spacer { flex: 1; }

    /* ---- 左：文件树 ---- */
    #sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #sidebar-header {
      padding: 10px 12px 6px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    #sidebar-header .project-name {
      color: var(--text);
      text-transform: none;
      font-weight: 600;
      letter-spacing: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 150px;
      font-size: 12px;
    }
    #sidebar-header .project-name:empty::before {
      content: '未打开';
      color: var(--text-subtle);
      font-weight: 400;
    }
    #tree-container {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0 12px;
      font-size: 13px;
    }
    .tree-item {
      padding: 3px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      user-select: none;
      color: var(--text);
      transition: background 0.1s, color 0.1s;
      line-height: 1.5;
    }
    .tree-item:hover { background: var(--surface-2); }
    .tree-item.active { background: var(--accent-soft); color: var(--accent); }
    .tree-item .tree-icon {
      width: 28px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }
    .tree-item .tree-icon svg { display: block; }
    .tree-item .tree-icon .tree-chevron { width: 12px; height: 12px; color: var(--text-subtle); }
    .tree-item .tree-icon .tree-folder { width: 15px; height: 15px; }
    .tree-item .tree-icon .tree-file { width: 14px; height: 14px; margin-left: 15px; color: var(--text-subtle); }
    .tree-item .tree-icon .tree-spin { width: 13px; height: 13px; margin-left: 15px; color: var(--text-subtle); animation: tree-spin 0.9s linear infinite; }
    @keyframes tree-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .tree-item .tree-icon .tree-spin { animation-duration: 2.4s; }
    }
    .tree-item.active .tree-icon { opacity: 1; }
    .tree-item .tree-name {
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tree-children { margin-left: 12px; }
    .tree-empty {
      padding: 48px 16px;
      color: var(--text-subtle);
      font-size: 12px;
      text-align: center;
      line-height: 1.8;
    }
    .tree-empty .empty-icon {
      font-size: 26px;
      display: block;
      margin-bottom: 10px;
      opacity: 0.45;
    }
    /* 滚动条 */
    #tree-container::-webkit-scrollbar, #chat-area::-webkit-scrollbar,
    #editor-tabs::-webkit-scrollbar { width: 10px; height: 10px; }
    #tree-container::-webkit-scrollbar-thumb, #chat-area::-webkit-scrollbar-thumb,
    #editor-tabs::-webkit-scrollbar-thumb {
      background: transparent;
      border: 3px solid transparent;
      border-radius: 8px;
      background-clip: padding-box;
    }
    #tree-container:hover::-webkit-scrollbar-thumb,
    #chat-area:hover::-webkit-scrollbar-thumb,
    #editor-tabs:hover::-webkit-scrollbar-thumb { background: #cfcfd6; background-clip: padding-box; border: 3px solid transparent; }
    #tree-container::-webkit-scrollbar-thumb:hover, #chat-area::-webkit-scrollbar-thumb:hover,
    #editor-tabs::-webkit-scrollbar-thumb:hover { background: #b0b0bc; background-clip: padding-box; }
    #tree-container::-webkit-scrollbar-track, #chat-area::-webkit-scrollbar-track,
    #editor-tabs::-webkit-scrollbar-track { background: transparent; }

    /* ---- 中：编辑器 ---- */
    #editor-pane {
      display: flex;
      flex-direction: column;
      background: var(--editor-bg);
      overflow: hidden;
    }
    #editor-tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      flex-shrink: 0;
      min-height: 35px;
    }
    #editor-tabs::-webkit-scrollbar { height: 0; }
    .editor-tab {
      padding: 0 12px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      transition: all 0.12s;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border-subtle);
      height: 35px;
      font-weight: 500;
      position: relative;
    }
    .editor-tab:hover { background: rgba(0,0,0,0.025); color: var(--text); }
    .editor-tab.active {
      background: var(--editor-bg);
      color: var(--text);
      font-weight: 600;
      border-bottom: 1px solid var(--editor-bg);
    }
    .editor-tab.active::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: var(--accent);
    }
    .editor-tab .close-btn {
      font-size: 14px;
      opacity: 0;
      padding: 0 2px;
      margin-left: 2px;
      width: 16px; height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: opacity 0.12s, color 0.12s, background 0.12s;
    }
    .editor-tab:hover .close-btn, .editor-tab.active .close-btn { opacity: 0.5; }
    .editor-tab .close-btn:hover { opacity: 1; color: var(--error); background: var(--error-soft); }
    #editor-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    #monaco-editor {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
    }
    #editor-empty {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-subtle);
      font-size: 13px;
      flex-direction: column;
      gap: 0;
      background: var(--editor-bg);
      padding: 32px;
      overflow: auto;
    }
    #editor-empty .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-bottom: 28px;
    }
    #editor-empty .welcome .welcome-logo {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 55%, #818cf8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      margin-bottom: 10px;
      box-shadow: 0 4px 16px rgba(79,70,229,0.22);
    }
    #editor-empty .welcome .welcome-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    #editor-empty .welcome .welcome-sub {
      font-size: 12.5px;
      color: var(--text-muted);
      font-weight: 400;
    }
    #editor-empty .shortcut-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      width: 340px;
      max-width: 100%;
    }
    #editor-empty .shortcut {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.12s;
      border: 1px solid transparent;
    }
    #editor-empty .shortcut:hover { background: var(--surface-2); border-color: var(--border-subtle); color: var(--text); }
    #editor-empty .shortcut kbd {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-subtle);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 1px 7px;
      line-height: 1.6;
    }
    #editor-empty .hint { font-size: 12px; color: var(--text-subtle); }

    /* ---- 右：Chat ---- */
    #chat-pane {
      background: var(--chat-bg);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #chat-header {
      padding: 0 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    #chat-header .chat-header-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 3px var(--success-soft);
    }
    #chat-header .chat-model-tag {
      margin-left: auto;
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: none;
      letter-spacing: 0;
      padding: 2px 8px;
      background: var(--surface-2);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      font-family: var(--font-mono);
    }
    #chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 8px;
    }
    .message { margin-bottom: 18px; display: flex; flex-direction: column; }
    .message.user { align-items: flex-end; }
    .message.assistant { align-items: flex-start; }
    .bubble {
      max-width: 88%;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
    }
    .message.user .bubble {
      background: var(--user-bubble-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-right-radius: 3px;
    }
    .message.assistant .bubble {
      background: transparent;
      color: var(--text);
      border: none;
      padding: 2px 0;
      border-radius: 0;
      max-width: 92%;
    }
    .message.assistant .bubble.intercept {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      box-shadow: var(--shadow-xs);
      max-width: 92%;
    }
    .meta { font-size: 10px; color: var(--text-subtle); margin-top: 4px; }
    .typing {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 10px 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-muted);
      font-size: 13px;
    }
    .typing::after { content: ''; animation: dots 1.4s infinite; }
    @keyframes dots {
      0%, 20% { content: '·'; letter-spacing: 0; }
      40% { content: '··'; }
      60%, 100% { content: '···'; }
    }
    .error { background: var(--error-soft) !important; border-color: #fecaca !important; color: #991b1b !important; }

    #chat-input-area {
      padding: 14px 16px 12px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--chat-bg);
    }
    #input-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .composer-wrap {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 10px 10px 10px 16px;
      transition: all 0.15s;
      box-shadow: var(--shadow-composer);
    }
    .composer-wrap:focus-within {
      border-color: var(--accent);
      background: #fff;
      box-shadow: 0 0 0 3px var(--accent-glow), var(--shadow-composer);
    }
    #question-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 6px 0;
      font-size: 14px;
      outline: none;
      font-family: var(--font-ui);
      line-height: 1.55;
    }
    #question-input:disabled { opacity: 0.5; }
    #question-input::placeholder { color: var(--text-subtle); }
    #submit-btn {
      width: 32px; height: 32px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      font-weight: 600;
      font-family: var(--font-ui);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(79,70,229,0.35);
    }
    #submit-btn:hover:not(:disabled) { background: var(--accent-hover); box-shadow: 0 4px 12px rgba(79,70,229,0.45); transform: translateY(-1px); }
    #submit-btn:active:not(:disabled) { transform: translateY(0); }
    #submit-btn:disabled { background: var(--surface-3); color: var(--text-subtle); cursor: not-allowed; box-shadow: none; transform: none; }
    .composer-hint {
      font-size: 10.5px;
      color: var(--text-subtle);
      text-align: center;
      letter-spacing: 0.01em;
    }
    .composer-hint kbd {
      font-family: var(--font-mono);
      font-size: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0 4px;
      color: var(--text-muted);
    }

    /* ---- 状态栏 ---- */
    #status-bar {
      background: #18181b;
      color: rgba(255,255,255,0.78);
      padding: 0 14px;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
      font-family: var(--font-mono);
      height: 22px;
      align-items: center;
      letter-spacing: 0.01em;
    }
    #status-bar .left, #status-bar .right { display: flex; gap: 14px; align-items: center; }
    #status-bar .left span:first-child { color: rgba(255,255,255,0.95); }

    /* ---- 模态框 ---- */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15,15,25,0.10);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 28px;
      width: 480px;
      max-width: 90vw;
      box-shadow: var(--shadow-lg);
    }
    .modal h3 {
      font-size: 16px;
      margin-bottom: 16px;
      color: var(--text);
      font-weight: 600;
    }
    .modal input[type="text"] {

      color: var(--text);

      justify-content: flex-end;
    }
    .modal-btn {
      padding: 8px 20px;
      border-radius: var(--radius-md);
      font-size: 13px;
      cursor: pointer;
      border: 1px solid var(--border-strong);

    /* ---- Diff 预览模态框 ---- */
    #diff-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15,15,25,0.14);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1100;
    }
    #diff-overlay.active { display: flex; }
    #diff-modal {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      width: 92vw;
      max-width: 1400px;
      height: 88vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }
    #diff-header {
      padding: 12px 20px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    #diff-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #diff-title .pending-badge {
      background: var(--warning);
      color: #fff;
      font-size: 11px;
      padding: 2px 9px;
      border-radius: 20px;
      font-weight: 600;
    }
    #diff-file-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 10px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .diff-file-tab {
      padding: 5px 12px;
      font-size: 12px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text-muted);
      white-space: nowrap;
      transition: all 0.12s;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
    }
    .diff-file-tab:hover { color: var(--text); border-color: var(--border-strong); box-shadow: var(--shadow-xs); }
    .diff-file-tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .diff-file-tab .action-tag {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 4px;
      margin-left: 6px;
      background: rgba(255,255,255,0.2);
    }
    .diff-file-tab:not(.active) .action-tag { background: var(--surface-2); color: var(--text-muted); }
    #diff-editor-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    #diff-editor {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
    }
    #diff-footer {
      padding: 14px 20px;
      background: #fff;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    #diff-hint {
      font-size: 12px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    #diff-actions {
      display: flex;
      gap: 10px;
    }
    .diff-btn {
      padding: 9px 24px;
      border-radius: var(--radius-md);
      font-size: 13px;
      cursor: pointer;
      border: 1px solid var(--border-strong);
      background: #fff;
      color: var(--text);
      font-weight: 600;
      transition: all 0.12s;
      font-family: var(--font-ui);
    }
    .diff-btn:hover:not(:disabled) { border-color: var(--text-muted); box-shadow: var(--shadow-sm); }
    .diff-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .diff-btn.confirm {

      color: #fff;
      border-color: var(--success);
      box-shadow: 0 1px 3px rgba(22,163,74,0.3);

    .diff-btn.cancel {

      color: #fff;
      border-color: var(--error);

    .diff-btn.cancel:hover:not(:disabled) { background: #b91c1c; box-shadow: 0 2px 10px rgba(220,38,38,0.4); }
    .diff-loading {

    /* ---- 任务控制条（JS 内联样式为主，此处补充圆角对齐） ---- */

    /* ---- 历史会话面板 ---- */
    #sessions-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15,15,25,0.14);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1200;
    }
    #sessions-overlay.active { display: flex; }
    #sessions-modal {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      width: 560px;
      max-width: 92vw;
      max-height: 76vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }
    #sessions-header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border);

      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;

    #sessions-title {

      align-items: center;

    }
    #sessions-title .sessions-count {

      font-weight: 500;

      border-radius: 20px;
      padding: 1px 9px;
    }
    #sessions-close-btn {
      width: 28px; height: 28px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    #sessions-close-btn:hover { border-color: var(--border-strong); color: var(--text); background: var(--surface-2); }
    #sessions-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
    }
    #sessions-list::-webkit-scrollbar { width: 10px; }

    .session-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      transition: all 0.15s;
      margin-bottom: 8px;
    }
    .session-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); background: var(--surface); }
    .session-card.current { border-color: var(--accent); background: var(--accent-soft); }
    .session-card .session-body { flex: 1; min-width: 0; }
    .session-card .session-preview {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);

      text-overflow: ellipsis;
      margin-bottom: 3px;
    }
    .session-card .session-meta {
      font-size: 11px;
      color: var(--text-subtle);
      font-family: var(--font-mono);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .session-card .session-tag {
      font-size: 10px;
      color: var(--accent);
      background: #fff;
      border: 1px solid var(--accent);
      border-radius: 4px;
      padding: 0 5px;
      font-weight: 600;
    }
    .session-delete-btn {
      width: 30px; height: 30px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-subtle);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .session-delete-btn:hover { color: var(--error); background: var(--error-soft); border-color: #fecaca; }
    .sessions-empty {
      padding: 56px 16px;
      color: var(--text-subtle);
      font-size: 13px;
      text-align: center;
      line-height: 1.8;
    }
    .sessions-empty .empty-icon { display: block; margin-bottom: 8px; opacity: 0.45; }

    @media (max-width: 1100px) {
      #main-body { grid-template-columns: 48px 220px 1fr 340px; }
    }
    @media (max-width: 920px) {

      #main-body { grid-template-columns: 190px 1fr 280px; }
      #session-info { display: none; }
    }
  </style>
</head>

    const SVG_CHEVRON_RIGHT = '<svg class="tree-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';
    const SVG_CHEVRON_DOWN = '<svg class="tree-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
    const SVG_FOLDER_CLOSED = '<svg class="tree-folder" viewBox="0 0 24 24" fill="#e9bd76" stroke="#d19d55" stroke-width="1.4" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>';
    const SVG_FOLDER_OPEN = '<svg class="tree-folder" viewBox="0 0 24 24" fill="#f3d9ab" stroke="#d19d55" stroke-width="1.4" stroke-linejoin="round"><path d="m6 14 1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.93a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg>';
    const SVG_FILE = '<svg class="tree-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>';
    const SVG_LOADING = '<svg class="tree-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.2-8.56"/></svg>';
    const TREE_ICON_DIR_CLOSED = SVG_CHEVRON_RIGHT + SVG_FOLDER_CLOSED;
    const TREE_ICON_DIR_OPEN = SVG_CHEVRON_DOWN + SVG_FOLDER_OPEN;

    // ---- session_id 管理 ----
    function getSessionId() {
      let sid = localStorage.getItem('rag_session_id');
      if (!sid) {
        sid = 'web-' + Math.random().toString(36).substring(2, 10);
        localStorage.setItem('rag_session_id', sid);
      }
      return sid;
    }
    function newSession() {
      // 若有未确认的 diff 预览，先关闭（不调用 cancel，让旧会话 pending 自然遗留或由后端清理）
      if (diffOverlay.classList.contains('active')) {
        closeDiffPreview();
      }
      const sid = 'web-' + Math.random().toString(36).substring(2, 10);
      localStorage.setItem('rag_session_id', sid);
      currentSessionId = sid;
      sessionInfo.textContent = `会话：${sid}`;
      chatArea.innerHTML = `<div class="message assistant"><div class="bubble">已开启新会话。请提问。</div></div>`;
      // 不清空已打开的项目（项目绑定独立于会话）
      questionInput.focus();
    }
    let currentSessionId = getSessionId();
    sessionInfo.textContent = `会话：${currentSessionId}`;
    clearBtn.addEventListener('click', newSession);

    // ---- Monaco Editor 初始化 ----
    let monacoReady = false;
    let editor = null;
    let models = new Map();  // filepath → monaco.editor.ITextModel
    let openTabs = [];       // [{filepath, name, lang}]
    let activeTab = null;

    require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });
    require(['vs/editor/editor.main'], function () {
      monacoReady = true;
      // 定义亮色主题（干净白底）
      monaco.editor.defineTheme('rag-light', {
        base: 'vs',
        inherit: true,
        rules: [],
        colors: {
          'editor.background': '#ffffff',
          'editor.foreground': '#18181b',
          'editorLineNumber.foreground': '#c8c8d0',
          'editorLineNumber.activeForeground': '#6b6b76',
          'editor.lineHighlightBackground': '#fbfbfd',
          'editor.lineHighlightBorder': '#f2f2f5',
          'editor.selectionBackground': '#eef2ff',
          'editor.inactiveSelectionBackground': '#f5f5f7',
          'editorCursor.foreground': '#4f46e5',
          'editor.findMatchBackground': '#eef2ff',
          'editorIndentGuide.background': '#f2f2f5',
          'editorIndentGuide.activeBackground': '#d8d8dd',
        }
      });
      // 创建编辑器实例
      editor = monaco.editor.create(monacoEditorDiv, {
        value: '',
        language: 'plaintext',
        theme: 'rag-light',
        automaticLayout: true,
        fontSize: 13,
        minimap: { enabled: false },
        scrollBeyondLastLine: false,
        tabSize: 4,
      });
      // Ctrl+S 保存
      editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, function () {
        saveCurrentFile();
      });
    });

    // 语言映射
    function getLanguage(filename) {
      const ext = filename.substring(filename.lastIndexOf('.') + 1).toLowerCase();
      const map = {
        py: 'python', js: 'javascript', ts: 'typescript', jsx: 'javascript',
        tsx: 'typescript', java: 'java', go: 'go', rs: 'rust',
        c: 'c', cpp: 'cpp', h: 'c', hpp: 'cpp', cs: 'csharp',
        rb: 'ruby', php: 'php', swift: 'swift', kt: 'kotlin',
        scala: 'scala', md: 'markdown', json: 'json',
        yaml: 'yaml', yml: 'yaml', html: 'html', css: 'css',
        scss: 'scss', less: 'less', sql: 'sql', sh: 'shell',
        bat: 'bat', xml: 'xml', toml: 'ini', ini: 'ini',
      };
      return map[ext] || 'plaintext';
    }

    // ---- 文件树 ----
    function renderTree(node, container, depth) {
      if (!node.children || node.children.length === 0) {
        if (depth === 0) {
          container.innerHTML = '<div class="tree-empty">目录为空</div>';
        }
        return;
      }
      const wrapper = document.createElement('div');
      wrapper.className = 'tree-children';
      for (const item of node.children) {
        const div = document.createElement('div');
        div.className = 'tree-item';
        div.dataset.path = item.path;
        div.dataset.type = item.type;

        if (item.type === 'dir') {
          div.innerHTML = `<span class="tree-icon">${TREE_ICON_DIR_CLOSED}</span><span class="tree-name">${item.name}</span>`;
          div.addEventListener('click', async (e) => {
            e.stopPropagation();
            const childWrapper = div.nextElementSibling;
            if (childWrapper && childWrapper.tagName === 'DIV' && childWrapper.classList.contains('tree-children')) {
              // 已加载，切换显示
              childWrapper.style.display = childWrapper.style.display === 'none' ? 'block' : 'none';
              div.querySelector('.tree-icon').innerHTML = childWrapper.style.display === 'none' ? TREE_ICON_DIR_CLOSED : TREE_ICON_DIR_OPEN;
            } else if (item.children === null || (item.expandable && !item._loaded)) {
              // 懒加载
              div.querySelector('.tree-icon').innerHTML = SVG_LOADING;
              const sub = await loadTree(item.path, 1);
              if (sub && !sub.error) {
                item.children = sub.children;
                item._loaded = true;
                const newWrapper = document.createElement('div');
                newWrapper.className = 'tree-children';
                renderTree(sub, newWrapper, depth + 1);
                div.after(newWrapper);
                div.querySelector('.tree-icon').innerHTML = TREE_ICON_DIR_OPEN;
              } else {
                div.querySelector('.tree-icon').innerHTML = TREE_ICON_DIR_CLOSED;
              }
            } else {
              // 已有 children，渲染
              const newWrapper = document.createElement('div');
              newWrapper.className = 'tree-children';
              renderTree({ children: item.children }, newWrapper, depth + 1);
              div.after(newWrapper);
              div.querySelector('.tree-icon').innerHTML = TREE_ICON_DIR_OPEN;
            }
          });
          // 如果已有 children（首次加载的深度内），预渲染
          if (item.children && item.children.length > 0 && depth === 0) {
            const subWrapper = document.createElement('div');
            subWrapper.className = 'tree-children';
            renderTree({ children: item.children }, subWrapper, depth + 1);
            wrapper.appendChild(div);
            wrapper.appendChild(subWrapper);
            continue;
          }
          // 已有 children 但还没渲染
          if (item.children && item.children.length > 0) {
            div.querySelector('.tree-icon').innerHTML = TREE_ICON_DIR_OPEN;
          }
        } else {
          const sizeStr = item.size < 1024 ? item.size + 'B' : (item.size / 1024).toFixed(1) + 'KB';
          div.innerHTML = `<span class="tree-icon">${SVG_FILE}</span><span class="tree-name">${item.name}</span>`;
          div.title = `${item.path} (${sizeStr})`;
          div.addEventListener('click', (e) => {
            e.stopPropagation();
            openFile(item.path, item.name);
          });
        }
        wrapper.appendChild(div);
      }
      container.appendChild(wrapper);
    }

    async function loadTree(path, depth) {
      try {
        const resp = await fetch(
          `/api/workspace/tree?session_id=${encodeURIComponent(currentSessionId)}&path=${encodeURIComponent(path)}&depth=${depth || 2}`
        );
        if (!resp.ok) return null;
        return await resp.json();
      } catch (e) {
        return null;
      }
    }

    // ---- 打开项目 ----
    async function openProject(projectPath) {
      if (!projectPath) return;
      openProjectBtn.disabled = true;
      openProjectBtn.textContent = '⏳ 打开中...';

      try {
        const resp = await fetch('/api/workspace/open', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: currentSessionId, project_path: projectPath }),
        });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({ error: `HTTP ${resp.status}` }));
          throw new Error(err.error || '打开失败');
        }
        const data = await resp.json();
        if (data.status === 'error') throw new Error(data.error || '打开失败');

        // 更新状态
        statusProject.textContent = `● 工作区: ${data.project_name}`;
        projectNameDisplay.textContent = data.project_name;
        modeLabel.textContent = `项目: ${data.project_name}`;

        // 加载文件树
        const tree = await loadTree(data.project_path, 2);
        if (tree && !tree.error) {
          treeContainer.innerHTML = '';
          renderTree(tree, treeContainer, 0);
        } else {
          treeContainer.innerHTML = '<div class="tree-empty">扫描失败</div>';
        }
      } catch (e) {
        alert('打开项目失败: ' + e.message);
        statusProject.textContent = '● 打开失败';
      } finally {
        openProjectBtn.disabled = false;
        openProjectBtn.textContent = '📁 打开项目';
      }
    }

    // 打开项目按钮：优先用 File System Access API，否则显示路径输入
    openProjectBtn.addEventListener('click', async () => {
      if (window.showDirectoryPicker) {
        try {
          const dirHandle = await window.showDirectoryPicker();
          // 注意：浏览器沙箱限制，dirHandle 不能直接转为绝对路径
          // 这里用 dirHandle.name 作为项目名，但路径需要用户手动确认
          const confirmed = confirm(`已选择目录: ${dirHandle.name}\n\n由于浏览器安全限制，需手动输入完整路径。\n点击"确定"打开路径输入框。`);
          if (confirmed) {
            showPathInput(dirHandle.name);
          }
        } catch (e) {
          if (e.name !== 'AbortError') showPathInput();
        }
      } else {
        showPathInput();
      }
    });

    function showPathInput(suggestedName) {
      projectPathInput.style.display = '';
      openPathBtn.style.display = '';
      projectPathInput.focus();
      if (suggestedName) {
        projectPathInput.placeholder = `输入完整路径（如 d:/projects/${suggestedName}）`;
      }
    }

    openPathBtn.addEventListener('click', () => {
      const path = projectPathInput.value.trim();
      if (path) {
        openProject(path);
        projectPathInput.style.display = 'none';
        openPathBtn.style.display = 'none';
        projectPathInput.value = '';
      }
    });
    projectPathInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') openPathBtn.click();
    });

    // ---- 编辑器标签页 + 文件读取/保存 ----
    async function openFile(filepath, filename) {
      // 已打开则切换
      const existing = openTabs.find(t => t.filepath === filepath);
      if (existing) {
        switchTab(existing);
        return;
      }

      // 读取文件内容
      try {
        const resp = await fetch(
          `/api/workspace/file?session_id=${encodeURIComponent(currentSessionId)}&filepath=${encodeURIComponent(filepath)}`
        );
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({ error: `HTTP ${resp.status}` }));
          throw new Error(err.error || '读取失败');
        }
        const data = await resp.json();

        if (!monacoReady || !editor) {
          alert('编辑器尚未加载完成，请稍后重试');
          return;
        }

        const lang = getLanguage(filename);
        const model = monaco.editor.createModel(data.content, lang);
        models.set(filepath, model);

        const tab = { filepath, name: filename, lang, model };
        openTabs.push(tab);
        renderTabs();
        switchTab(tab);
      } catch (e) {
        alert('打开文件失败: ' + e.message);
      }
    }

    function renderTabs() {
      editorTabs.innerHTML = '';
      for (const tab of openTabs) {
        const el = document.createElement('div');
        el.className = 'editor-tab' + (tab === activeTab ? ' active' : '');
        el.innerHTML = `<span>${tab.name}</span><span class="close-btn" data-path="${tab.filepath}">×</span>`;
        el.addEventListener('click', (e) => {
          if (e.target.classList.contains('close-btn')) {
            closeTab(tab);
          } else {
            switchTab(tab);
          }
        });
        editorTabs.appendChild(el);
      }
    }

    function switchTab(tab) {
      activeTab = tab;
      if (tab) {
        editor.setModel(tab.model);
        monacoEditorDiv.style.display = '';
        editorEmpty.style.display = 'none';
        statusLang.textContent = tab.lang;
        renderTabs();
      }
    }

    function closeTab(tab) {
      const idx = openTabs.indexOf(tab);
      if (idx === -1) return;
      openTabs.splice(idx, 1);
      tab.model.dispose();
      models.delete(tab.filepath);

      if (activeTab === tab) {
        if (openTabs.length > 0) {
          switchTab(openTabs[Math.max(0, idx - 1)]);
        } else {
          activeTab = null;
          editor.setModel(null);
          monacoEditorDiv.style.display = 'none';
          editorEmpty.style.display = '';
          statusLang.textContent = '';
        }
      }
      renderTabs();
    }

    async function saveCurrentFile() {
      if (!activeTab) return;
      const content = activeTab.model.getValue();
      try {
        const resp = await fetch('/api/workspace/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            session_id: currentSessionId,
            filepath: activeTab.filepath,
            content: content,
          }),
        });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({ error: `HTTP ${resp.status}` }));
          throw new Error(err.error || '保存失败');
        }
        const data = await resp.json();
        if (data.status === 'saved') {
          statusProject.textContent = `✅ 已保存 ${activeTab.name}（快照ID=${data.snapshot_id}）`;
          setTimeout(() => {
            statusProject.textContent = `● 工作区: ${projectNameDisplay.textContent}`;
          }, 3000);
        } else {
          throw new Error(data.error || '保存失败');
        }
      } catch (e) {
        alert('保存失败: ' + e.message);
      }
    }

    // ---- Chat 逻辑 ----
    function appendMessage(role, text) {
      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      // 检测拦截标记 [INTERCEPT:need_project]，渲染特殊 UI
      if (role === 'assistant' && text.startsWith('[INTERCEPT:need_project]')) {
        // 去掉标记，提取正文
        const content = text.replace('[INTERCEPT:need_project]', '').trim();
        bubble.innerHTML = '';

        // 警告图标 + 标题
        const title = document.createElement('div');
        title.style.cssText = 'font-size:14px;font-weight:700;margin-bottom:8px;color:#d97706;font-family:var(--font-ui);';
        title.textContent = '⚠️ 请先打开项目或上传代码文件';
        bubble.appendChild(title);

        // 正文
        const desc = document.createElement('div');
        desc.style.cssText = 'font-size:13px;line-height:1.6;margin-bottom:12px;color:#18181b;font-family:var(--font-ui);';
        desc.textContent = content.split('\n').filter(l => !l.startsWith('⚠️')).join('\n').trim();
        bubble.appendChild(desc);

        // 按钮组
        const btnGroup = document.createElement('div');
        btnGroup.style.cssText = 'display:flex;gap:10px;';

        const openBtn = document.createElement('button');
        openBtn.textContent = '📁 打开项目';
        openBtn.style.cssText = 'padding:7px 18px;border-radius:6px;border:1px solid #4f46e5;background:#4f46e5;color:#fff;cursor:pointer;font-size:13px;font-weight:600;font-family:var(--font-ui);box-shadow:0 1px 3px rgba(79,70,229,0.3);transition:all 0.2s;';
        openBtn.addEventListener('click', () => {
          openProjectBtn.click();
        });

        btnGroup.appendChild(openBtn);
        bubble.appendChild(btnGroup);

        bubble.classList.add('intercept');
      } else {
        bubble.textContent = text;
      }

      msg.appendChild(bubble);
      chatArea.appendChild(msg);
      chatArea.scrollTop = chatArea.scrollHeight;
      return msg;
    }

    function appendTyping() {
      const msg = document.createElement('div');
      msg.className = 'message assistant';
      msg.id = 'typing-msg';
      const typing = document.createElement('div');
      typing.className = 'typing';
      msg.appendChild(typing);
      chatArea.appendChild(msg);
      chatArea.scrollTop = chatArea.scrollHeight;
    }
    function removeTyping() {
      const t = document.getElementById('typing-msg');
      if (t) t.remove();
    }

    inputForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = questionInput.value.trim();
      if (!question) return;

      appendMessage('user', question);
      questionInput.value = '';
      questionInput.disabled = true;
      submitBtn.disabled = true;
      appendTyping();

      // 当前任务控制（用于暂停/继续/取消）
      let currentTaskId = null;
      let pollTimer = null;

      try {
        // 1. 提交任务（异步模式，立即返回 task_id）
        const resp = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, session_id: currentSessionId }),
        });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({ error: '请求失败' }));
          throw new Error(err.error || `HTTP ${resp.status}`);
        }
        const data = await resp.json();
        currentTaskId = data.task_id;

        // 同步模式（chitchat/weather/kb_search/intercept）：后端直接返回 answer，无需轮询
        if (!currentTaskId || data.mode !== 'async') {
          removeTyping();
          const msg = appendMessage('assistant', data.answer || '（无返回）');
          await checkPendingModifications();
          refreshModifiedFiles(data);
          return;
        }

        // 2. 显示任务控制条（暂停/取消按钮）
        showTaskControls(currentTaskId);

        // 3. 轮询任务状态
        await new Promise((resolve, reject) => {
          pollTimer = setInterval(async () => {
            try {
              const sresp = await fetch(`/api/task/${currentTaskId}/status`);
              if (!sresp.ok) return;
              const sdata = await sresp.json();

              // 更新进度提示
              updateTypingStep(sdata.step_info || '');

              if (sdata.state === 'done') {
                clearInterval(pollTimer);
                resolve(sdata);
              } else if (sdata.state === 'cancelled') {
                clearInterval(pollTimer);
                reject(new Error('任务已取消'));
              } else if (sdata.state === 'error') {
                clearInterval(pollTimer);
                reject(new Error(sdata.error || '执行出错'));
              }
              // running / paused 继续轮询
            } catch (e) {
              // 网络错误，继续轮询
            }
          }, 800);  // 800ms 轮询间隔
        }).then(async (sdata) => {
          removeTyping();
          removeTaskControls();
          const msg = appendMessage('assistant', sdata.answer || '（无返回）');

          // 检查是否有待确认的 diff 预览
          await checkPendingModifications();

          // 刷新已打开的文件
          refreshModifiedFiles(sdata);
        }).catch((err) => {
          removeTyping();
          removeTaskControls();
          const msg = appendMessage('assistant', `⚠️ ${err.message}`);
          msg.querySelector('.bubble').classList.add('error');
        });

      } catch (err) {
        removeTyping();
        removeTaskControls();
        const msg = appendMessage('assistant', `❌ ${err.message}`);
        msg.querySelector('.bubble').classList.add('error');
      } finally {
        questionInput.disabled = false;
        submitBtn.disabled = false;
        questionInput.focus();
      }

      // ====== 任务控制条（暂停/继续/取消） ======
      function showTaskControls(taskId) {
        removeTaskControls();  // 先清理旧的
        const bar = document.createElement('div');
        bar.id = 'task-controls';
        bar.style.cssText = 'display:flex;align-items:center;gap:10px;padding:10px 14px;margin:10px 0;background:#fbfbfd;border-radius:8px;border:1px solid #ececef;font-size:13px;';

        const status = document.createElement('span');
        status.id = 'task-status-text';
        status.textContent = '⏳ 思考中...';
        status.style.cssText = 'flex:1;color:#6b6b76;';

        const pauseBtn = document.createElement('button');
        pauseBtn.id = 'task-pause-btn';
        pauseBtn.textContent = '⏸ 暂停';
        pauseBtn.style.cssText = 'padding:5px 14px;border-radius:6px;border:1px solid #d8d8dd;background:#fff;color:#6b6b76;cursor:pointer;font-size:12px;font-family:var(--font-ui);font-weight:500;transition:all 0.2s;';
        pauseBtn.addEventListener('click', async () => {
          try {
            const r = await fetch(`/api/task/${taskId}/pause`, { method: 'POST' });
            const d = await r.json();
            if (d.state === 'paused') {
              pauseBtn.style.display = 'none';
              resumeBtn.style.display = '';
              status.textContent = '⏸ 已暂停';
            }
          } catch (e) {}
        });

        const resumeBtn = document.createElement('button');
        resumeBtn.id = 'task-resume-btn';
        resumeBtn.textContent = '▶ 继续';
        resumeBtn.style.cssText = 'padding:5px 14px;border-radius:6px;border:1px solid #4f46e5;background:#4f46e5;color:#fff;cursor:pointer;font-size:12px;font-family:var(--font-ui);font-weight:500;box-shadow:0 1px 3px rgba(79,70,229,0.3);transition:all 0.2s;';
        resumeBtn.style.display = 'none';
        resumeBtn.addEventListener('click', async () => {
          try {
            const r = await fetch(`/api/task/${taskId}/resume`, { method: 'POST' });
            const d = await r.json();
            if (d.state === 'running') {
              resumeBtn.style.display = 'none';
              pauseBtn.style.display = '';
              status.textContent = '⏳ 思考中...';
            }
          } catch (e) {}
        });

        const cancelBtn = document.createElement('button');
        cancelBtn.textContent = '✗ 取消';
        cancelBtn.style.cssText = 'padding:5px 14px;border-radius:6px;border:1px solid #dc2626;background:transparent;color:#dc2626;cursor:pointer;font-size:12px;font-family:var(--font-ui);font-weight:500;transition:all 0.2s;';
        cancelBtn.addEventListener('click', async () => {
          try {
            await fetch(`/api/task/${taskId}/cancel`, { method: 'POST' });
            status.textContent = '🛑 正在取消...';
            pauseBtn.disabled = true;
            resumeBtn.disabled = true;
            cancelBtn.disabled = true;
          } catch (e) {}
        });

        bar.appendChild(status);
        bar.appendChild(pauseBtn);
        bar.appendChild(resumeBtn);
        bar.appendChild(cancelBtn);

        // 插入到聊天区
        chatArea.appendChild(bar);
        chatArea.scrollTop = chatArea.scrollHeight;
      }

      function removeTaskControls() {
        const bar = document.getElementById('task-controls');
        if (bar) bar.remove();
      }

      function updateTypingStep(stepInfo) {
        const status = document.getElementById('task-status-text');
        if (status && stepInfo) {
          status.textContent = `⏳ ${stepInfo}`;
        }
      }
    });

    // Agent 修改文件后，刷新已打开的标签页
    async function refreshModifiedFiles(data) {
      // 从回答中检测是否包含修改操作（简单实现：检查是否有快照ID）
      // 如果当前有打开的文件，重新读取内容
      if (!openTabs.length) return;
      for (const tab of openTabs) {
        try {
          const resp = await fetch(
            `/api/workspace/file?session_id=${encodeURIComponent(currentSessionId)}&filepath=${encodeURIComponent(tab.filepath)}`
          );
          if (resp.ok) {
            const fileData = await resp.json();
            const currentContent = tab.model.getValue();
            if (fileData.content !== currentContent) {
              // 文件被修改，更新编辑器内容（保留光标位置）
              const position = editor.getPosition();
              tab.model.setValue(fileData.content);
              if (tab === activeTab && position) {
                editor.setPosition(position);
              }
              statusProject.textContent = `🔄 ${tab.name} 已被 Agent 修改`;
              setTimeout(() => {
                statusProject.textContent = `● 工作区: ${projectNameDisplay.textContent}`;
              }, 3000);
            }
          }
        } catch (e) {
          // 忽略刷新错误
        }
      }
    }

    // ---- Diff 预览：检测 pending 修改并展示 Monaco DiffEditor ----
    let diffEditor = null;
    let pendingDiffData = [];      // 当前待确认修改列表
    let activeDiffIdx = 0;         // 当前展示的 diff 索引

    const diffOverlay = document.getElementById('diff-overlay');
    const diffFileTabs = document.getElementById('diff-file-tabs');
    const diffPendingBadge = document.getElementById('diff-pending-badge');
    const diffEditorDiv = document.getElementById('diff-editor');
    const diffLoading = document.getElementById('diff-loading');
    const diffConfirmBtn = document.getElementById('diff-confirm-btn');
    const diffCancelBtn = document.getElementById('diff-cancel-btn');
    const diffHint = document.getElementById('diff-hint');

    // 获取文件名（从完整路径）
    function getFilename(filepath) {
      const parts = filepath.replace(/\\/g, '/').split('/');
      return parts[parts.length - 1] || filepath;
    }

    // 聊天响应后检查是否有待确认修改
    async function checkPendingModifications() {
      try {
        const resp = await fetch(
          `/api/code/pending?session_id=${encodeURIComponent(currentSessionId)}`
        );
        if (!resp.ok) return;
        const data = await resp.json();
        if (data.count > 0 && data.pending.length > 0) {
          // 需要从 pending 中提取 old_content/new_content
          // 但 /api/code/pending 只返回简化信息，需额外拿完整数据
          // 这里 pending 列表已包含 old_content/new_content（由 preview_edit_impl 暂存）
          pendingDiffData = data.pending;
          showDiffPreview();
        }
      } catch (e) {
        // 忽略检查错误
      }
    }

    // 显示 Diff 预览模态框
    function showDiffPreview() {
      if (!pendingDiffData.length) return;
      activeDiffIdx = 0;

      // 更新 badge
      diffPendingBadge.textContent = `${pendingDiffData.length} 个待确认`;

      // 渲染文件 tab
      renderDiffFileTabs();

      // 显示模态框
      diffOverlay.classList.add('active');
      diffLoading.style.display = '';

      // 确保 Monaco 已加载
      if (!monacoReady) {
        diffLoading.textContent = '编辑器加载中，请稍候...';
        const waitTimer = setInterval(() => {
          if (monacoReady) {
            clearInterval(waitTimer);
            createDiffEditor();
            switchDiffTab(0);
          }
        }, 200);
      } else {
        createDiffEditor();
        switchDiffTab(0);
      }

      // 禁用输入框（等用户确认/撤销后恢复）
      questionInput.disabled = true;
      submitBtn.disabled = true;
    }

    function renderDiffFileTabs() {
      diffFileTabs.innerHTML = '';
      pendingDiffData.forEach((mod, idx) => {
        const tab = document.createElement('div');
        tab.className = 'diff-file-tab' + (idx === activeDiffIdx ? ' active' : '');
        const filename = getFilename(mod.filepath);
        const actionLabel = mod.action === 'write_file'
          ? (mod.is_new ? '新建' : '覆写')
          : '修改';
        tab.innerHTML = `<span>${filename}</span><span class="action-tag">${actionLabel}</span>`;
        tab.title = mod.filepath;
        tab.addEventListener('click', () => switchDiffTab(idx));
        diffFileTabs.appendChild(tab);
      });
    }

    function createDiffEditor() {
      if (diffEditor) return;  // 已创建
      diffEditor = monaco.editor.createDiffEditor(diffEditorDiv, {
        theme: 'rag-light',
        automaticLayout: true,
        fontSize: 13,
        readOnly: true,         // diff 预览只读
        renderSideBySide: true,  // 并排对比
        minimap: { enabled: false },
        scrollBeyondLastLine: false,
      });
      diffLoading.style.display = 'none';
    }

    function switchDiffTab(idx) {
      if (idx < 0 || idx >= pendingDiffData.length) return;
      activeDiffIdx = idx;
      renderDiffFileTabs();

      if (!diffEditor || !monacoReady) return;

      const mod = pendingDiffData[idx];
      const filename = getFilename(mod.filepath);
      const lang = getLanguage(filename);
      const oldContent = mod.old_content || '';
      const newContent = mod.new_content || '';

      // 创建 original/modified model
      const originalModel = monaco.editor.createModel(oldContent, lang);
      const modifiedModel = monaco.editor.createModel(newContent, lang);

      diffEditor.setModel({
        original: originalModel,
        modified: modifiedModel,
      });

      // 更新底部提示
      const actionText = mod.action === 'write_file'
        ? (mod.is_new ? '新建文件' : '全量覆写')
        : '局部修改';
      diffHint.textContent = `文件: ${filename}（${actionText}）| 修改前 ${oldContent.split('\n').length} 行 → 修改后 ${newContent.split('\n').length} 行`;
    }

    // 确认修改：调 /api/code/confirm，刷新编辑器
    diffConfirmBtn.addEventListener('click', async () => {
      diffConfirmBtn.disabled = true;
      diffCancelBtn.disabled = true;
      diffConfirmBtn.textContent = '应用中...';

      try {
        const resp = await fetch(
          `/api/code/confirm?session_id=${encodeURIComponent(currentSessionId)}`,
          { method: 'POST' }
        );
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({ error: `HTTP ${resp.status}` }));
          throw new Error(err.error || '确认失败');
        }
        const data = await resp.json();

        // 关闭模态框
        closeDiffPreview();

        // 刷新被修改的文件标签
        const modifiedFiles = (data.results || []).filter(r => r.status === 'applied');
        await refreshModifiedFilesAfterConfirm(modifiedFiles);

        // 提示成功
        statusProject.textContent = `✅ 已确认 ${data.confirmed_count} 个修改`;
        appendMessage('assistant', `✅ 已应用 ${data.confirmed_count} 个修改。\n${modifiedFiles.map(r => `  • ${getFilename(r.filepath)}`).join('\n')}\n\n如需撤销，可使用撤销功能恢复到修改前。`);
        setTimeout(() => {
          statusProject.textContent = `● 工作区: ${projectNameDisplay.textContent}`;
        }, 4000);
      } catch (e) {
        alert('确认修改失败: ' + e.message);
      } finally {
        diffConfirmBtn.disabled = false;
        diffCancelBtn.disabled = false;
        diffConfirmBtn.textContent = '✓ 确认修改';
      }
    });

    // 撤销修改：调 /api/code/cancel，提示重新输入需求
    diffCancelBtn.addEventListener('click', async () => {
      diffConfirmBtn.disabled = true;
      diffCancelBtn.disabled = true;
      diffCancelBtn.textContent = '撤销中...';

      try {
        const resp = await fetch(
          `/api/code/cancel?session_id=${encodeURIComponent(currentSessionId)}`,
          { method: 'POST' }
        );
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({ error: `HTTP ${resp.status}` }));
          throw new Error(err.error || '撤销失败');
        }
        const data = await resp.json();

        // 关闭模态框
        closeDiffPreview();

        // 提示用户重新输入需求
        statusProject.textContent = `↩️ 已撤销 ${data.cancelled_count} 个修改`;
        appendMessage('assistant', `↩️ 已撤销 ${data.cancelled_count} 个待确认修改，文件未做任何改动。\n\n请重新描述你的需求，我会重新生成修改方案。`);
        setTimeout(() => {
          statusProject.textContent = `● 工作区: ${projectNameDisplay.textContent}`;
        }, 4000);

        // 自动聚焦输入框
        questionInput.focus();
      } catch (e) {
        alert('撤销失败: ' + e.message);
      } finally {
        diffConfirmBtn.disabled = false;
        diffCancelBtn.disabled = false;
        diffCancelBtn.textContent = '✗ 撤销并重新输入';
      }
    });

    function closeDiffPreview() {
      diffOverlay.classList.remove('active');
      // 释放 diff editor 的 model 避免内存泄漏
      if (diffEditor) {
        const model = diffEditor.getModel();
        if (model) {
          if (model.original) model.original.dispose();
          if (model.modified) model.modified.dispose();
        }
        diffEditor.setModel(null);
      }
      pendingDiffData = [];
      // 恢复输入框
      questionInput.disabled = false;
      submitBtn.disabled = false;
      questionInput.focus();
    }

    // 确认后刷新被修改的文件
    async function refreshModifiedFilesAfterConfirm(modifiedFiles) {
      for (const result of modifiedFiles) {
        const filepath = result.filepath;
        // 如果文件已在编辑器中打开，刷新内容
        const tab = openTabs.find(t => t.filepath === filepath);
        if (tab) {
          try {
            const resp = await fetch(
              `/api/workspace/file?session_id=${encodeURIComponent(currentSessionId)}&filepath=${encodeURIComponent(filepath)}`
            );
            if (resp.ok) {
              const fileData = await resp.json();
              const position = editor.getPosition();
              tab.model.setValue(fileData.content);
              if (tab === activeTab && position) {
                editor.setPosition(position);
              }
            }
          } catch (e) {
            // 忽略刷新错误
          }
        }
      }
    }

    // ---- 历史会话管理 ----
    const historyBtn = document.getElementById('history-btn');
    const sessionsOverlay = document.getElementById('sessions-overlay');
    const sessionsList = document.getElementById('sessions-list');
    const sessionsCount = document.getElementById('sessions-count');
    const sessionsCloseBtn = document.getElementById('sessions-close-btn');

    function formatSessionTime(ts) {
      if (!ts) return '';
      const d = new Date(ts * 1000);
      const diff = (Date.now() - d.getTime()) / 1000;
      if (diff < 60) return '刚刚';
      if (diff < 3600) return `${Math.floor(diff / 60)} 分钟前`;
      if (diff < 86400) return `${Math.floor(diff / 3600)} 小时前`;
      if (diff < 172800) return '昨天';
      const pad = (n) => String(n).padStart(2, '0');
      return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    async function openSessionsPanel() {
      sessionsOverlay.classList.add('active');
      await loadSessionsList();
    }

    function closeSessionsPanel() {
      sessionsOverlay.classList.remove('active');
    }

    async function loadSessionsList() {
      sessionsList.innerHTML = '<div class="sessions-empty">加载中...</div>';
      try {
        const resp = await fetch('/api/sessions');
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        sessionsCount.textContent = `${data.count} 个`;
        sessionsList.innerHTML = '';
        if (!data.sessions.length) {
          sessionsList.innerHTML = '<div class="sessions-empty"><span class="empty-icon">🕐</span>暂无历史会话</div>';
          return;
        }
        for (const s of data.sessions) {
          sessionsList.appendChild(buildSessionCard(s));
        }
      } catch (e) {
        sessionsList.innerHTML = `<div class="sessions-empty">加载失败: ${e.message}</div>`;
      }
    }

    function buildSessionCard(s) {
      const card = document.createElement('div');
      card.className = 'session-card' + (s.session_id === currentSessionId ? ' current' : '');

      const body = document.createElement('div');
      body.className = 'session-body';

      const preview = document.createElement('div');
      preview.className = 'session-preview';
      preview.textContent = s.preview || '（无预览）';

      const meta = document.createElement('div');
      meta.className = 'session-meta';
      const timeSpan = document.createElement('span');
      timeSpan.textContent = `${formatSessionTime(s.last_active_at)} · ${s.message_count} 条消息`;
      meta.appendChild(timeSpan);

      if (s.session_id === currentSessionId) {
        const tag = document.createElement('span');
        tag.className = 'session-tag';
        tag.textContent = '当前';
        meta.appendChild(tag);
      }

      body.appendChild(preview);
      body.appendChild(meta);

      const delBtn = document.createElement('button');
      delBtn.className = 'session-delete-btn';
      delBtn.title = '删除此会话';
      delBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
      delBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        await deleteSessionById(s.session_id, card);
      });

      card.appendChild(body);
      card.appendChild(delBtn);

      // 点击卡片：切换到该会话并加载历史消息
      card.addEventListener('click', () => switchToSession(s.session_id));

      return card;
    }

    async function deleteSessionById(sessionId, cardEl) {
      const previewText = cardEl.querySelector('.session-preview').textContent;
      if (!confirm(`确定删除该会话吗？\n\n「${previewText.slice(0, 40)}」\n\n删除后不可恢复。`)) return;
      try {
        const resp = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}`, { method: 'DELETE' });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        cardEl.remove();
        const remaining = sessionsList.querySelectorAll('.session-card').length;
        sessionsCount.textContent = `${remaining} 个`;
        if (remaining === 0) {
          sessionsList.innerHTML = '<div class="sessions-empty"><span class="empty-icon">🕐</span>暂无历史会话</div>';
        }
        if (sessionId === currentSessionId) {
          statusProject.textContent = '🗑️ 当前会话历史已删除';
          setTimeout(() => {
            statusProject.textContent = `● 工作区: ${projectNameDisplay.textContent}`;
          }, 3000);
        }
      } catch (e) {
        alert('删除失败: ' + e.message);
      }
    }

    async function switchToSession(sessionId) {
      try {
        const resp = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}/messages`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();

        // 切换当前会话（后续对话沿用该会话历史）
        currentSessionId = sessionId;
        localStorage.setItem('rag_session_id', sessionId);
        sessionInfo.textContent = `会话：${sessionId}`;

        // 渲染历史消息
        chatArea.innerHTML = '';
        if (!data.messages.length) {
          appendMessage('assistant', '该会话没有历史消息。');
        } else {
          for (const m of data.messages) {
            appendMessage(m.role === 'user' ? 'user' : 'assistant', m.content);
          }
        }
        closeSessionsPanel();
        questionInput.focus();
      } catch (e) {
        alert('加载会话失败: ' + e.message);
      }
    }

    historyBtn.addEventListener('click', openSessionsPanel);
    sessionsCloseBtn.addEventListener('click', closeSessionsPanel);
    sessionsOverlay.addEventListener('click', (e) => {
      if (e.target === sessionsOverlay) closeSessionsPanel();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && sessionsOverlay.classList.contains('active')) {
        closeSessionsPanel();
      }
    });

    // ---- 页面加载时检查健康状态 ----
    fetch('/api/health')
      .then(r => r.json())
      .then(data => {
        if (!modeLabel.textContent.includes('项目')) {
          modeLabel.textContent = `模式: ${data.mode}`;
        }
      })
      .catch(() => {});

    // ---- 欢迎屏快捷方式（仅新增绑定，不影响既有逻辑） ----
    (function () {
      const scOpen = document.getElementById('sc-open');
      const scSave = document.getElementById('sc-save');
      const scNew = document.getElementById('sc-new');
      if (scOpen) scOpen.addEventListener('click', () => openProjectBtn.click());
      if (scSave) scSave.addEventListener('click', () => { if (activeTab) saveCurrentFile(); });
      if (scNew) scNew.addEventListener('click', () => clearBtn.click());
      document.addEventListener('keydown', (e) => {
        if (!(e.ctrlKey || e.metaKey) || e.shiftKey || e.altKey) return;
        const k = e.key.toLowerCase();
        if (k === 'o') {
          e.preventDefault();
          openProjectBtn.click();
        } else if (k === 'k') {
          e.preventDefault();
          clearBtn.click();
        }
      });
    })();
  </script>
</body>
</html>
